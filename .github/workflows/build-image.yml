# Builds the image on push to master (Dockerfile/entrypoint changes) or manually.
# Uses the automatic GITHUB_TOKEN to push to GHCR - no repo secrets to configure.
name: Build and push pretix custom image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - docker-entrypoint-plugins.sh
      - .github/workflows/build-image.yml
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pretix-custom:latest
            ghcr.io/${{ github.repository_owner }}/pretix-custom:${{ github.sha }}
