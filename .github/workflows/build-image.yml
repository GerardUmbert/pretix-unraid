# Builds the image on push to master (Dockerfile/entrypoint changes) or manually.
# Uses the automatic GITHUB_TOKEN to push to GHCR - no repo secrets to configure.
name: Build and push pretix custom image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - docker-entrypoint-plugins.sh
      - mcp/**
      - pretix-mcp-http.sh
      - supervisord-mcp.conf
      - supervisord-tasks.conf
      - pretix-task.sh
      - pretix-cron.sh
      - pretix-db-copy.py
      - nginx-mcp-location.conf
      - .github/workflows/build-image.yml
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase, GitHub usernames may not be.
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pretix-custom:latest
            ghcr.io/${{ env.OWNER }}/pretix-custom:${{ github.sha }}
