        # Bundled MCP server (mcp/src/http.ts). The node process itself
        # requires the bearer secret on every request and listens on
        # localhost only, so this route is the only way to reach it.
        location = /mcp {
            proxy_pass http://127.0.0.1:3000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
